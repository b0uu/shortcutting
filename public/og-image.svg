<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="warm" cx="22%" cy="14%" r="90%">
      <stop offset="0%" stop-color="#d4693a" stop-opacity="0.10"/>
      <stop offset="42%" stop-color="#d4693a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#d4693a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4693a" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#d4693a"/>
      <stop offset="100%" stop-color="#d4693a" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="railGlow" x="-300%" y="-40%" width="700%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="630" fill="#1c1a17"/>
  <rect width="1200" height="630" fill="url(#warm)"/>

  <!-- watermark mark, balances the right side -->
  <g transform="translate(1006 372) scale(7)" fill="none" stroke="#d4693a" stroke-width="2.75"
     stroke-linecap="butt" stroke-linejoin="miter" opacity="0.05">
    <path d="M7 9.5H13.5"/>
    <path d="M17 9.5H23"/>
    <path d="M11.5 9.5L17 22H25.5"/>
  </g>

  <!-- inset frame -->
  <rect x="24.5" y="24.5" width="1151" height="581" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- ===== header ===== -->
  <g transform="translate(88 58) scale(1.22)" fill="none" stroke="#d4693a" stroke-width="2.75"
     stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M7 9.5H13.5"/>
    <path d="M17 9.5H23"/>
    <path d="M11.5 9.5L17 22H25.5"/>
  </g>
  <text x="142" y="89" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="33"
        font-weight="600" fill="#e8e4da" letter-spacing="-0.5">shortcutting</text>

  <!-- status: pips + timer -->
  <g transform="translate(0 70)">
    <rect x="930" y="0" width="22" height="4" rx="2" fill="#7db884"/>
    <rect x="958" y="0" width="22" height="4" rx="2" fill="#d4693a"/>
    <rect x="986" y="0" width="22" height="4" rx="2" fill="#3a3630"/>
    <rect x="1014" y="0" width="22" height="4" rx="2" fill="#3a3630"/>
  </g>
  <text x="1112" y="72" text-anchor="end" dominant-baseline="central"
        font-family="'Geist Mono', ui-monospace, monospace"
        font-size="26" font-weight="500" fill="#d4693a" letter-spacing="-0.5">0.74s</text>

  <!-- divider -->
  <line x1="88" y1="120" x2="1112" y2="120" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- ===== target ===== -->
  <text x="88" y="214" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="14"
        font-weight="500" fill="#9f9688" letter-spacing="3.4">TARGET</text>
  <text x="88" y="282" font-family="'Geist Mono', ui-monospace, monospace" font-size="52"
        font-weight="500" fill="#d4693a" letter-spacing="-1.5">total = total.strip()</text>

  <!-- ===== active editor line (caught mid-fix) ===== -->
  <rect x="88" y="356" width="3.5" height="66" rx="2" fill="url(#rail)" filter="url(#railGlow)"/>
  <text x="120" y="406" font-family="'Geist Mono', ui-monospace, monospace" font-size="52"
        font-weight="400" letter-spacing="-1.5"><tspan fill="#e8e4da">total = total.strip(</tspan><tspan fill="#d4693a" fill-opacity="0.9">█</tspan></text>

  <!-- ===== tagline ===== -->
  <text x="88" y="540" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" font-size="27"
        font-weight="400" fill="#9f9688" letter-spacing="-0.2">Match the target text as fast as possible.</text>
</svg>
